apiVersion: apps/v1
kind: Deployment
metadata:
  name: friendly-neighborhood-watch
  namespace: friendly-neighborhood
  labels:
    app: friendly-neighborhood-watch
    app.kubernetes.io/part-of: web-slinger
spec:
  replicas: 2
  selector:
    matchLabels:
      app: friendly-neighborhood-watch
  template:
    metadata:
      labels:
        app: friendly-neighborhood-watch
        app.kubernetes.io/part-of: web-slinger
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: friendly-neighborhood-watch:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

