name: Web-Slinger Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type DESTROY to authorize a destruction plan'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: web-slinger-terraform-destroy
  cancel-in-progress: false

jobs:
  plan-destroy:
    name: Create Terraform Destroy Plan
    if: inputs.confirm_destroy == 'DESTROY'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Create destruction plan
        run: terraform plan -destroy -input=false -out=tfplan

      - name: Create readable plan for review
        run: terraform show -no-color tfplan > tfplan.txt

      - name: Upload destruction plan for review
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: |
            infra/tfplan
            infra/tfplan.txt
          if-no-files-found: error
          retention-days: 1

  destroy:
    name: Apply Approved Destruction Plan
    needs: plan-destroy
    if: inputs.confirm_destroy == 'DESTROY'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Configure required reviewers for this environment in GitHub Settings.
    environment: terraform-destroy

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Download destruction plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: infra

      - name: Apply the approved destruction plan
        run: terraform apply -input=false tfplan
