name: Web-Slinger Release and Kubernetes Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "k8s/**"
      - "scripts/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: web-slinger-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Publish, and Test Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: friendly-neighborhood-watch
      K8S_NAMESPACE: friendly-neighborhood
      K8S_DEPLOYMENT: friendly-neighborhood-watch

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish container image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --tag "$IMAGE" \
            --build-arg APP_VERSION="$IMAGE_TAG" \
            app

          docker push "$IMAGE"

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Published image: $IMAGE"

      - name: Create kind Kubernetes cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: web-slinger

      - name: Load published image into kind
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail

          docker pull "$IMAGE"
          docker tag "$IMAGE" friendly-neighborhood-watch:local

          kind load docker-image \
            friendly-neighborhood-watch:local \
            --name web-slinger

      - name: Deploy Kubernetes manifests
        run: |
          set -euo pipefail

          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for Deployment rollout
        run: |
          set -euo pipefail

          kubectl rollout status \
            "deployment/$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            --timeout=120s

      - name: Verify desired and ready replicas
        run: |
          set -euo pipefail

          kubectl get deployment "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE"

          DESIRED_REPLICAS="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.replicas}')"

          READY_REPLICAS="$(kubectl get deployment "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" \
            -o jsonpath='{.status.readyReplicas}')"

          if [[ "$DESIRED_REPLICAS" != "2" || "$READY_REPLICAS" != "2" ]]; then
            echo "ERROR: Expected 2 desired and ready replicas."
            echo "Desired: $DESIRED_REPLICAS; Ready: ${READY_REPLICAS:-0}"
            exit 1
          fi

          echo "SUCCESS: $READY_REPLICAS of $DESIRED_REPLICAS replicas are ready."

      - name: Test Kubernetes drift detection and recovery
        run: bash scripts/drift-test.sh

      - name: Save deployment evidence
        if: always()
        run: |
          mkdir -p evidence

          kubectl get pods \
            --namespace "$K8S_NAMESPACE" -o wide \
            > evidence/pods.txt 2>&1 || true

          kubectl get deployment "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" -o yaml \
            > evidence/deployment.yaml 2>&1 || true

          kubectl get service "$K8S_DEPLOYMENT" \
            --namespace "$K8S_NAMESPACE" -o yaml \
            > evidence/service.yaml 2>&1 || true

          kubectl get events \
            --namespace "$K8S_NAMESPACE" \
            --sort-by=.metadata.creationTimestamp \
            > evidence/events.txt 2>&1 || true

      - name: Upload Kubernetes test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-slinger-kubernetes-evidence-${{ github.run_id }}
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
