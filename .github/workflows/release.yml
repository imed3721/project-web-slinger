name: Web-Slinger Release and Kubernetes Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "k8s/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  release:
    name: Build, Push, and Test Kubernetes Deployment
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-west-2
      ECR_REPOSITORY: friendly-neighborhood-watch

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ECR_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --tag "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            --build-arg APP_VERSION="$IMAGE_TAG" \
            app

          docker push "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "image=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Install kind
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: web-slinger

      - name: Load image into kind
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          docker pull "$IMAGE"
          docker tag "$IMAGE" friendly-neighborhood-watch:local

          kind load docker-image \
            friendly-neighborhood-watch:local \
            --name web-slinger

      - name: Deploy Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      - name: Wait for Deployment
        run: |
          kubectl rollout status \
            deployment/friendly-neighborhood-watch \
            -n friendly-neighborhood \
            --timeout=120s

      - name: Check desired replicas
        run: |
          kubectl get deployment friendly-neighborhood-watch \
            -n friendly-neighborhood

          test "$(kubectl get deployment friendly-neighborhood-watch \
            -n friendly-neighborhood \
            -o jsonpath='{.spec.replicas}')" = "2"

          test "$(kubectl get deployment friendly-neighborhood-watch \
            -n friendly-neighborhood \
            -o jsonpath='{.status.readyReplicas}')" = "2"

      - name: Save deployment evidence
        if: always()
        run: |
          mkdir -p evidence

          kubectl get pods -n friendly-neighborhood -o wide \
            > evidence/pods.txt 2>&1 || true

          kubectl get deployment friendly-neighborhood-watch \
            -n friendly-neighborhood -o yaml \
            > evidence/deployment.yaml 2>&1 || true

          kubectl get service friendly-neighborhood-watch \
            -n friendly-neighborhood -o yaml \
            > evidence/service.yaml 2>&1 || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-slinger-kubernetes-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 7
